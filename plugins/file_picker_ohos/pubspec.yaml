name: file_picker_ohos
description: OpenHarmony support for the current file_picker platform interface.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  android_file_picker: ^1.1.0
  file_picker_platform_interface: ^3.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: file_picker
    platforms:
      ohos:
        package: com.file_picker
        pluginClass: FilePickerPlugin
        dartPluginClass: FilePickerOhos
