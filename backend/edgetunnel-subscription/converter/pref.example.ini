[common]
api_mode = true
api_access_token = __PRIVATE_API_TOKEN__
enable_insert = false
base_path = base
clash_rule_base = base/all_base.tpl
proxy_config = NONE
proxy_ruleset = NONE
proxy_subscription = NONE

[rulesets]
enabled = true
overwrite_original_rules = true
update_ruleset_on_request = true

[server]
listen = 127.0.0.1
port = 25510
serve_file_root =

[advanced]
log_level = error
print_debug_info = false
max_pending_connections = 16
max_concurrent_threads = 4
max_allowed_rulesets = 64
max_allowed_download_size = 8388608
enable_cache = true
cache_subscription = 60
cache_config = 300
cache_ruleset = 21600
async_fetch_ruleset = true
