proxy-groups:
  - name: 默认代理
    icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Proxy.png
    type: select
    proxies:
      - 故障转移
      - 自动选择
  - name: 故障转移
    icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Fallback.png
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true
    timeout: 5000
    expected-status: "204"
    max-failed-times: 2
    include-all-proxies: true
    exclude-filter: ^普通| · 普通$
  - name: 自动选择
    icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Auto.png
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    timeout: 5000
    expected-status: "204"
    max-failed-times: 2
    include-all-proxies: true
    exclude-filter: ^普通| · 普通$
  - name: Claude 专用
    icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Claude.png
    type: fallback
    url: https://api.anthropic.com/v1/models
    interval: 600
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: "401/405"
    include-all-proxies: true
    exclude-filter: (?i)warp|^cf-tcp-backup$|^普通| · 普通$
  - name: ChatGPT 专用
    icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/ChatGPT.png
    type: fallback
    url: https://api.openai.com/v1/models
    interval: 600
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: "401"
    include-all-proxies: true
    exclude-filter: (?i)warp|^cf-tcp-backup$|^普通| · 普通$
  - name: Gemini 专用
    icon: https://raw.githubusercontent.com/sssstwee/edgetunnel/main/resources/icons/Gemini.png
    type: fallback
    url: https://generativelanguage.googleapis.com/v1beta/models
    interval: 600
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: "403/404"
    include-all-proxies: true
    exclude-filter: (?i)warp|^cf-tcp-backup$|^普通| · 普通$
rules:
  # A fake-ip without a live mapping (cached across a core restart) fails fast instead of timing out as a LAN address.
  - IP-CIDR,198.18.0.0/16,REJECT,no-resolve
  # Block Antigravity background telemetry uploads and retry loops to play.googleapis.com.
  - DOMAIN,play.googleapis.com,REJECT
  - RULE-SET,cn-ai-extra,DIRECT
  - AND,((NETWORK,UDP),(RULE-SET,anthropic-bootstrap)),REJECT
  - RULE-SET,anthropic-bootstrap,Claude 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,anthropic)),REJECT
  - RULE-SET,anthropic,Claude 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,anthropic-ip)),REJECT
  - RULE-SET,anthropic-ip,Claude 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,claude-deps)),REJECT
  - RULE-SET,claude-deps,Claude 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,openai-bootstrap)),REJECT
  - RULE-SET,openai-bootstrap,ChatGPT 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,openai)),REJECT
  - RULE-SET,openai,ChatGPT 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,openai-voice)),REJECT
  - RULE-SET,openai-voice,ChatGPT 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,gemini-bootstrap)),REJECT
  - RULE-SET,gemini-bootstrap,Gemini 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,meta-bootstrap)),REJECT
  - RULE-SET,meta-bootstrap,故障转移,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,gemini)),REJECT
  - RULE-SET,gemini,Gemini 专用,no-resolve
  # Google's own list wins over the shared AI list, so Google hosts stay on Gemini 专用.
  - AND,((NETWORK,UDP),(RULE-SET,google)),REJECT
  - RULE-SET,google,Gemini 专用,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,ai-shared)),REJECT
  - RULE-SET,ai-shared,故障转移,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,twitter-ai)),REJECT
  - RULE-SET,twitter-ai,故障转移,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,bing-ai)),REJECT
  - RULE-SET,bing-ai,故障转移,no-resolve
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,line)),REJECT
  - RULE-SET,line,默认代理
  - AND,((NETWORK,UDP),(RULE-SET,line-ip)),REJECT
  - RULE-SET,line-ip,默认代理,no-resolve
  - RULE-SET,ai-cn,DIRECT
  - AND,((NETWORK,UDP),(RULE-SET,ai)),REJECT
  - RULE-SET,ai,故障转移
  # Domestic push SDKs sit in the ad list; apps need them for notifications.
  - RULE-SET,cn-push,DIRECT
  - RULE-SET,reject,REJECT
  - AND,((NETWORK,UDP),(RULE-SET,gfw)),REJECT
  - RULE-SET,gfw,默认代理
  - AND,((NETWORK,UDP),(RULE-SET,telegramcidr)),REJECT
  - RULE-SET,telegramcidr,默认代理,no-resolve
  - AND,((NETWORK,UDP),(RULE-SET,proxy)),REJECT
  - RULE-SET,proxy,默认代理
  - AND,((NETWORK,TCP),(DOMAIN,perfops2.byte-test.com)),默认代理
  - RULE-SET,direct,DIRECT
  # Foreign TLDs are a fallback guess: the curated direct list wins, the broad cn list does not.
  - AND,((NETWORK,UDP),(RULE-SET,tld-not-cn)),REJECT
  - RULE-SET,tld-not-cn,默认代理
  - RULE-SET,cn,DIRECT
  - RULE-SET,cncidr,DIRECT,no-resolve
  # Unlisted hosts from installed AI binaries; domestic and LAN traffic stays direct above.
  - AND,((NETWORK,UDP),(PROCESS-NAME-REGEX,(?i)^(claude|claude code|com\.apple\.virtualization\.virtualmachine)( helper.*| \(.*\))?(\.exe)?$)),REJECT
  - PROCESS-NAME-REGEX,(?i)^(claude|claude code|com\.apple\.virtualization\.virtualmachine)( helper.*| \(.*\))?(\.exe)?$,Claude 专用
  - AND,((NETWORK,UDP),(PROCESS-PATH-REGEX,(?i)(/Applications/Claude\.app/|/\.local/share/claude/versions/|/Library/Application Support/Claude/claude-code/|/extensions/anthropic\.claude-code-|/Caskroom/claude-code/))),REJECT
  - PROCESS-PATH-REGEX,(?i)(/Applications/Claude\.app/|/\.local/share/claude/versions/|/Library/Application Support/Claude/claude-code/|/extensions/anthropic\.claude-code-|/Caskroom/claude-code/),Claude 专用
  - AND,((NETWORK,UDP),(PROCESS-NAME-REGEX,(?i)^(codex|chatgpt|codex-code-mode-host)( helper.*| \(.*\))?(\.exe)?$)),REJECT
  - PROCESS-NAME-REGEX,(?i)^(codex|chatgpt|codex-code-mode-host)( helper.*| \(.*\))?(\.exe)?$,ChatGPT 专用
  - AND,((NETWORK,UDP),(PROCESS-PATH-REGEX,(?i)(/Applications/(ChatGPT|Codex)\.app/))),REJECT
  - PROCESS-PATH-REGEX,(?i)(/Applications/(ChatGPT|Codex)\.app/),ChatGPT 专用
  - AND,((NETWORK,UDP),(PROCESS-NAME-REGEX,(?i)^(antigravity|gemini)( helper.*| \(.*\))?(\.exe)?$)),REJECT
  - PROCESS-NAME-REGEX,(?i)^(antigravity|gemini)( helper.*| \(.*\))?(\.exe)?$,Gemini 专用
  - AND,((NETWORK,UDP),(PROCESS-PATH-REGEX,(?i)(/Applications/Antigravity\.app/|\\Programs\\Antigravity\\))),REJECT
  - PROCESS-PATH-REGEX,(?i)(/Applications/Antigravity\.app/|\\Programs\\Antigravity\\),Gemini 专用
  - AND,((NETWORK,UDP),(PROCESS-NAME-REGEX,(?i)^(muse|musecode|muse-code|muse code|cursor|windsurf|trae|magpie|magpie-bun)( helper.*| \(.*\))?(\.exe)?$)),REJECT
  - PROCESS-NAME-REGEX,(?i)^(muse|musecode|muse-code|muse code|cursor|windsurf|trae|magpie|magpie-bun)( helper.*| \(.*\))?(\.exe)?$,故障转移
  - AND,((NETWORK,UDP),(PROCESS-PATH-REGEX,(?i)(/Applications/(Cursor|Windsurf|Trae|Magpie|Muse|Amp|Warp|T3 Code( \(Beta\))?|Grok Bot)\.app/|/\.grok/|/\.cache/magpie/bun/))),REJECT
  - PROCESS-PATH-REGEX,(?i)(/Applications/(Cursor|Windsurf|Trae|Magpie|Muse|Amp|Warp|T3 Code( \(Beta\))?|Grok Bot)\.app/|/\.grok/|/\.cache/magpie/bun/),故障转移
  - MATCH,默认代理
  - NETWORK,UDP,REJECT
mode: rule
tcp-concurrent: true
keep-alive-interval: 30
keep-alive-idle: 30
find-process-mode: strict
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  # Dial the sniffed domain, so apps that resolved through a poisoned DNS outside the core still reach the real host.
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - +.push.apple.com
    - Mijia Cloud
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - any:53
    - tcp://any:53
