name: fl_clash
description: 小猫代理，基于 FlClash v0.9.2 和 Mihomo 的鸿蒙客户端。
publish_to: 'none'
version: 1.0.0+2026103002
environment:
  sdk: '>=3.10.0 <4.0.0'

hooks:
  user_defines:
    sqlite3:
      source: sqlite3
      url_pattern: "https://github.com/tljk/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
    setup:
      build_assets: true
    rust_api:
      build_assets: true

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  intl: any
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  shared_preferences_platform_interface: ^2.4.2
  window:
    path: plugins/window
  dynamic_color: ^2.1.0
  proxy:
    path: plugins/proxy
  launch_at_startup:
    git:
      url: https://github.com/chen08209/launch_at_startup.git
      ref: e930ce65c5804343103447e01d39fccabedc8681
  json_annotation: ^4.12.0
  file_picker: ^12.3.0
  file_picker_ohos:
    path: plugins/file_picker_ohos
  mobile_scanner: ^7.4.2
  app_links: ^7.2.2
  win32_registry: ^3.0.3
  tray:
    path: plugins/tray
  wifi_ssid:
    path: plugins/wifi_ssid
  collection: ^1.19.1
  animations: ^3.0.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.4
  ffi: ^2.2.0

  dio: ^5.11.1
  win32: ^6.4.0
  code_forge:
    path: plugins/code_forge
  re_highlight: ^0.0.3
  archive: ^4.3.0
  emoji_regex: ^0.0.5
  uni_platform: ^0.1.3
  device_info_plus: ^13.3.0
  connectivity_plus: 7.2.0
  screen_retriever: ^0.2.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod: ^3.4.3
  material_color_utilities: ^0.13.0
  material_new_shapes: ^1.0.0
  flutter_svg: ^2.3.0
  path_parsing: ^1.1.0
  flutter_cache_manager: ^3.4.5
  crypto: ^3.0.7
  yaml: ^3.1.4
  super_sliver_list: ^0.4.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  rust_api:
    path: plugins/rust_api
  setup:
    path: plugins/setup
  qr: ^4.0.0
dependency_overrides:
  material_ui:
    path: third_party/material_ui
  cupertino_ui:
    path: third_party/cupertino_ui
  code_assets:
    git:
      url: https://gitcode.com/zhong_ning/fluttertpc_dart_native_zn_whl_1009.git
      path: pkgs/code_assets
      ref: f89acaa6544ab092022f20a396fd1d9fe53bed57
  sqlite3:
    git:
      url: https://github.com/tljk/sqlite3.dart
      path: sqlite3
      ref: b9f5614768384be50003bd1a0ebbd02c7a945967
  device_info_plus:
    git:
      url: https://github.com/tljk/plus_plugins.git
      path: packages/device_info_plus/device_info_plus
      ref: 74b7201c76f6f410624736770b3d658500cf2dde
  package_info_plus:
    git:
      url: https://github.com/tljk/plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: 74b7201c76f6f410624736770b3d658500cf2dde
  connectivity_plus:
    git:
      url: https://github.com/tljk/plus_plugins.git
      path: packages/connectivity_plus/connectivity_plus
      ref: 74b7201c76f6f410624736770b3d658500cf2dde
  path_provider:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/path_provider/path_provider"
      ref: d4e49daa0acbd0bc419d58b1da27d64d44fab54b
  url_launcher:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/url_launcher/url_launcher"
      ref: ae4494a78db5a9e0fe760b0eba9231605ae45716
  shared_preferences:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/shared_preferences/shared_preferences"
      ref: d80255f2133f581515d5603f45753a595be5f303
  image_picker:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/image_picker/image_picker"
      ref: 1af98579e1a95d4fca19e422d26f5b6856ac38ba
  app_links:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_app_links.git
      ref: 109fac28a22c3f5ab403049adec46412dacf1acd
      path: app_links
  mobile_scanner:
    git:
      url: https://github.com/tljk/mobile_scanner.git
      ref: 9dec43468e4e7aae53dd75e34079fe604a6dc8bf
  dynamic_color:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dynamic_color.git
      path: packages/dynamic_color
      ref: 9b197ffcfbfb49ea94137dffc812b3cb10bf61f9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  args: ^2.7.0
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9

  drift_dev: ^2.35.1
  intl_utils: ^2.8.16
  test: ^1.31.1
  sqlite3: ^3.7.0
  cross_file: ^0.3.5+5
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatar/
    - assets/images/services/
    - core/Clash.Meta/component/ca/ca-certificates.crt
    - path: assets/images/tray/unix/
      platforms: [ linux, macos ]
    - path: assets/images/tray/macos/
      platforms: [ macos ]
    - path: assets/images/tray/windows/
      platforms: [ windows ]
  shaders:
    - shaders/liquid_glass.frag
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: arb
  output_dir: lib/l10n
