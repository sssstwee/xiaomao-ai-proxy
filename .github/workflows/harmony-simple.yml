name: 小猫代理 HarmonyOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: harmony-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check for committed secrets
        run: |
          bash .github/scripts/check-no-secrets.sh
          python3 -m unittest discover -s test/ci
          bash tool/hooks/test.sh
      - name: Load pinned toolchains
        run: grep -v '^#' .github/harmony-pinned-shas.env >> "$GITHUB_ENV"
      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: 26.0.0.821
          cache: true
      - name: Set up HarmonyOS Flutter 3.47.7
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TOOL_CACHE/flutter-ohos"
          git init "$FLUTTER_DIR"
          git -C "$FLUTTER_DIR" remote add origin https://gitcode.com/CPF-Flutter/flutter_flutter.git
          git -C "$FLUTTER_DIR" fetch --depth 1 origin "$FLUTTER_OHOS_SHA"
          git -C "$FLUTTER_DIR" checkout FETCH_HEAD
          git -C "$FLUTTER_DIR" tag 3.47.7+ohos-0.0.1-pre
          git -C "$FLUTTER_DIR" apply "$GITHUB_WORKSPACE/.github/flutter_ohos.patch"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_DIR/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: harmony-flutter-3.47.7-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: harmony-flutter-3.47.7-${{ runner.os }}-
      - name: Disable client build hooks for validation
        run: |
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
      - name: Resolve dependencies
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        run: flutter pub get
      - name: Generate Dart sources
        run: |
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/l10n lib/models/generated lib/providers/generated lib/database/generated
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests without compiling client libraries
        run: python3 tool/test_without_native_rust.py
      - name: Test HarmonyOS file picker
        run: flutter test --no-pub plugins/file_picker_ohos/test --reporter expanded
      - name: Test HarmonyOS VPN lifecycle
        run: node --test test/native/harmony_vpn_test.cjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Prepare pinned Mihomo sources
        run: |
          dart core/prepare_mihomo.dart
          dart core/prepare_ohos_modfile.dart
      - name: Test Go core with HarmonyOS-compatible compiler
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          go test -mod=readonly -modfile=.ohos.mod -tags=with_gvisor ./...
          go test -mod=readonly -modfile=.ohos.mod -tags='with_gvisor openharmony' . ./tun ./platform
          go vet -mod=readonly -modfile=.ohos.mod -tags=with_gvisor ./...
          go vet -mod=readonly -modfile=.ohos.mod -tags='with_gvisor openharmony' . ./tun ./platform
      - name: Restore verified upstream sources
        run: dart core/prepare_mihomo.dart --reverse
      - name: Test build harness without invoking builds
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart test
      - name: Set up Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --target aarch64-unknown-linux-ohos
      - name: Check Rust HarmonyOS target
        env:
          RUSTUP_TOOLCHAIN: '1.92.0'
        run: bash plugins/rust_api/tool/ohos_rust.sh check
      - name: Test Rust library algorithms
        env:
          RUSTUP_TOOLCHAIN: '1.92.0'
        run: cargo test --locked --manifest-path plugins/rust_api/rust/Cargo.toml --lib
      - name: Set up HarmonyOS Go for authorized package run
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          OHOS_GO_DIR="$RUNNER_TOOL_CACHE/ohos-go"
          git init "$OHOS_GO_DIR"
          git -C "$OHOS_GO_DIR" remote add origin https://gitcode.com/openharmony-sig/ohos_golang_go.git
          git -C "$OHOS_GO_DIR" fetch --depth 1 origin "$OHOS_GO_SHA"
          git -C "$OHOS_GO_DIR" checkout FETCH_HEAD
          cd "$OHOS_GO_DIR/src"
          ./make.bash
          echo "GOROOT=$OHOS_GO_DIR" >> "$GITHUB_ENV"
          echo "$OHOS_GO_DIR/bin" >> "$GITHUB_PATH"
      - name: Build unsigned HarmonyOS packages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          RUSTUP_TOOLCHAIN: '1.92.0'
          FLCLASH_OHOS_BUILD: '1'
        run: |
          sed -i 's/build_assets: false/build_assets: true/g' pubspec.yaml
          dart setup.dart ohos --env stable -v
      - name: Checksums
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          cd dist
          sha256sum -- *.hap *.app > SHA256SUMS
      - name: Upload packages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: xiaomao-proxy-HarmonyOS-${{ github.sha }}
          path: |
            dist/*.hap
            dist/*.app
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xiaomao-proxy-HarmonyOS-${{ github.sha }}
          path: release-input

      - name: Prepare verified release assets
        id: release
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml)"
          TAG="v$VERSION"
          TAG_REFS="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [[ -n "$TAG_REFS" ]]; then
            TAG_COMMIT="$(tail -n 1 <<< "$TAG_REFS" | cut -f 1)"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Release version already belongs to another commit; bump pubspec.yaml before building."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd release-input
          sha256sum --check SHA256SUMS
          mkdir ../release
          cp -- *.hap ../release/
          for APP in *.app; do
            zip -q -j "../release/$APP.zip" "$APP"
          done
          cd ../release
          sha256sum -- *.hap *.app.zip > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: 小猫代理 ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            GitHub Actions 构建：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            HAP 为原始未签名安装包，真机安装需要使用包含设备 UDID 的证书和 Profile 签名。
          files: |
            release/*.hap
            release/*.app.zip
            release/SHA256SUMS

