dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  nameserver:
    - https://1.1.1.1/dns-query#默认代理
    - https://8.8.8.8/dns-query#默认代理
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  respect-rules: false
  nameserver-policy:
    rule-set:cn-ai-extra:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    +.claude.ai:
      - https://1.1.1.1/dns-query#Claude 专用
      - https://8.8.8.8/dns-query#Claude 专用
    +.anthropic.com:
      - https://1.1.1.1/dns-query#Claude 专用
      - https://8.8.8.8/dns-query#Claude 专用
    +.openai.com:
      - https://1.1.1.1/dns-query#ChatGPT 专用
      - https://8.8.8.8/dns-query#ChatGPT 专用
    +.chatgpt.com:
      - https://1.1.1.1/dns-query#ChatGPT 专用
      - https://8.8.8.8/dns-query#ChatGPT 专用
    +.gemini.google.com:
      - https://1.1.1.1/dns-query#Gemini 专用
      - https://8.8.8.8/dns-query#Gemini 专用
    +.muse.ai:
      - https://1.1.1.1/dns-query#故障转移
      - https://8.8.8.8/dns-query#故障转移
    +.metaaivm.com:
      - https://1.1.1.1/dns-query#故障转移
      - https://8.8.8.8/dns-query#故障转移
    rule-set:anthropic-bootstrap,anthropic:
      - https://1.1.1.1/dns-query#Claude 专用
      - https://8.8.8.8/dns-query#Claude 专用
    rule-set:claude-deps:
      - https://1.1.1.1/dns-query#Claude 专用
      - https://8.8.8.8/dns-query#Claude 专用
    rule-set:openai-bootstrap,openai:
      - https://1.1.1.1/dns-query#ChatGPT 专用
      - https://8.8.8.8/dns-query#ChatGPT 专用
    rule-set:gemini-bootstrap,gemini,google:
      - https://1.1.1.1/dns-query#Gemini 专用
      - https://8.8.8.8/dns-query#Gemini 专用
    rule-set:meta-bootstrap,ai-shared,twitter-ai,bing-ai:
      - https://1.1.1.1/dns-query#故障转移
      - https://8.8.8.8/dns-query#故障转移
    rule-set:line:
      - https://1.1.1.1/dns-query#默认代理
      - https://8.8.8.8/dns-query#默认代理
    rule-set:private:
      - system://
    rule-set:ai-cn:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    rule-set:ai:
      - https://1.1.1.1/dns-query#故障转移
      - https://8.8.8.8/dns-query#故障转移
    rule-set:gfw,proxy:
      - https://1.1.1.1/dns-query#默认代理
      - https://8.8.8.8/dns-query#默认代理
    rule-set:cn-push,direct:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    rule-set:tld-not-cn:
      - https://1.1.1.1/dns-query#默认代理
      - https://8.8.8.8/dns-query#默认代理
    rule-set:cn:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
